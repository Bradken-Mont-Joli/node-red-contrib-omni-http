<script type="text/javascript">
    RED.nodes.registerType('omni-http',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value:""},
            routes: {value: [{method:"get", url:"", props: []}]} // 🟢 Évolution de la structure vers un tableau de propriétés
        },
        inputs:0, outputs:1, icon: "white-globe.svg",
        label: function() { 
            if (this.name) return this.name;
            if (this.routes && this.routes.length > 0) {
                var methods = [...new Set(this.routes.map(r => r.method.toUpperCase()))];
                var routeLabel = this.routes.length > 1 ? this.routes.length + " routes" : this.routes[0].url;
                return "[" + methods.join("/") + "] " + routeLabel;
            }
            return "omni http in"; 
        },
        oneditprepare: function() {
            var root = RED.settings.httpNodeRoot || "/";
            if (root.slice(-1) !== "/") { root += "/"; }

            // Interface principale des Endpoints
            $("#node-input-routes-container").css('min-height','300px').editableList({
                addItem: function(container, i, opt) {
                    var route = opt.hasOwnProperty('method') ? opt : {method:"get", url:"", props: []};
                    if (!route.props) route.props = [];
                    
                    // 🟢 FIX : Largeur restreinte à calc(100% - 35px) pour ne plus jamais empiéter sur le bouton "X" global
                    var mainContainer = $('<div/>', {style: "display: inline-flex; flex-direction: column; width: calc(100% - 35px); gap: 6px; padding: 4px 0; vertical-align: top;"}).appendTo(container);
                    
                    // --- LIGNE 1 : METHODE + URL + BOUTON CONFIG ---
                    var row1 = $('<div/>', {style: "display: flex; align-items: center; width: 100%; gap: 5px;"}).appendTo(mainContainer);
                    
                    var select = $('<select/>',{class:"node-input-route-method", style:"width:90px; margin:0;"}).appendTo(row1);
                    ['get','post','put','delete','patch'].forEach(m => select.append($("<option></option>").val(m).text(m.toUpperCase())));
                    select.val(route.method);

                    $('<span/>', {style: "font-family: monospace; color: #888; font-size: 12px; white-space: nowrap; user-select: none;"}).text(root).appendTo(row1);

                    var inputUrl = $('<input/>',{class:"node-input-route-url", type:"text", style:"flex: 1; margin:0;", placeholder:"entities/document"}).appendTo(row1);
                    var displayUrl = route.url || "";
                    if (displayUrl.startsWith('/')) displayUrl = displayUrl.substring(1);
                    inputUrl.val(displayUrl);

                    // 🟢 BOUTON TOGGLE (Masqué par défaut)
                    var toggleBtn = $('<button/>', {
                        class: "red-ui-button red-ui-button-small",
                        style: "margin-left: 5px; white-space: nowrap;",
                        html: '<i class="fa fa-cog"></i> Variables'
                    }).appendTo(row1);

                    // --- PANNEAU DES VARIABLES (Masqué par défaut) ---
                    var propsPanel = $('<div/>', {
                        class: "node-input-route-props-panel",
                        style: "display: none; margin-top: 8px; border: 1px dashed #ddd; padding: 10px; border-radius: 4px; background: #fcfcfc;"
                    }).appendTo(mainContainer);

                    // Entête du panneau avec bouton d'ajout de sous-variable
                    var panelHeader = $('<div/>', {style: "display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;"}).appendTo(propsPanel);
                    $('<span/>', {style: "font-size: 11px; font-weight: bold; color: #666;"}).text("PROPRIÉTÉS INJECTÉES SUR RÉCEPTION :").appendTo(panelHeader);
                    
                    var addPropBtn = $('<button/>', {
                        class: "red-ui-button red-ui-button-small",
                        html: '<i class="fa fa-plus"></i> Ajouter'
                    }).appendTo(panelHeader);

                    var propsListContainer = $('<div/>', {class: "node-input-route-props-list", style: "display: flex; flex-direction: column; gap: 4px;"}).appendTo(propsPanel);

                    // Fonction d'ajout d'une ligne de propriété (Style nœud Inject)
                    function addPropertyRow(propData) {
                        var pData = propData || {key: "payload", val: "", type: "str"};
                        var pRow = $('<div/>', {class: "node-input-route-prop-row", style: "display: flex; align-items: center; gap: 5px; width: 100%;"}).appendTo(propsListContainer);
                        
                        $('<span/>', {style: "font-family: monospace; color: #444; font-size: 11px;"}).text("msg.").appendTo(pRow);
                        
                        var pKey = $('<input/>', {class: "node-input-prop-key", type: "text", style: "width: 120px; margin:0;", placeholder: "payload"}).val(pData.key).appendTo(pRow);
                        $('<span/>', {style: "color: #999;"}).text("=").appendTo(pRow);
                        
                        var pVal = $('<input/>', {class: "node-input-prop-val", type: "text", style: "flex: 1; margin:0;"}).appendTo(pRow);
                        
                        // 🟢 INITIALISATION DU TYPEDINPUT NATIF DE NODE-RED
                        pVal.typedInput({
                            default: pData.type || 'str',
                            types: ['str','num','bool','json','date','env','flow','global']
                        });
                        pVal.typedInput('value', pData.val);

                        // Bouton de suppression de la sous-variable
                        var delPropBtn = $('<button/>', {
                            class: "red-ui-button red-ui-button-small",
                            style: "border: none; background: transparent; color: #999;",
                            html: '<i class="fa fa-trash"></i>',
                            click: function(e) { e.preventDefault(); pRow.remove(); }
                        }).appendTo(pRow);
                    }

                    // Charger les variables existantes
                    if (route.props && route.props.length > 0) {
                        route.props.forEach(p => addPropertyRow(p));
                        propsPanel.show(); // Si des variables existent, on montre le panneau à l'ouverture
                    }

                    // Événements des boutons
                    toggleBtn.on('click', function(e) {
                        e.preventDefault();
                        propsPanel.toggle();
                    });

                    addPropBtn.on('click', function(e) {
                        e.preventDefault();
                        addPropertyRow();
                    });
                },
                removable: true, sortable: true
            });

            this.routes.forEach(r => $("#node-input-routes-container").editableList('addItem', r));
        },
        oneditsave: function() {
            var node = this;
            node.routes = [];

            $("#node-input-routes-container").editableList('items').each(function(i) {
                var method = $(this).find(".node-input-route-method").val();
                var url = $(this).find(".node-input-route-url").val().trim();
                
                var routeObj = {
                    method: method,
                    url: url,
                    props: []
                };

                // Extraction de toutes les sous-propriétés configurées pour cette ligne
                $(this).find(".node-input-route-prop-row").each(function() {
                    var k = $(this).find(".node-input-prop-key").val().trim();
                    var v = $(this).find(".node-input-prop-val").typedInput('value');
                    var t = $(this).find(".node-input-prop-val").typedInput('type');
                    
                    if (k) {
                        routeObj.props.push({key: k, val: v, type: t});
                    }
                });
                
                if (url) {
                    url = url.replace(/^\/+|\/+$/g, '');
                    url = '/' + url;
                    routeObj.url = url;
                    node.routes.push(routeObj);
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="omni-http">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="Laisser vide pour calcul dynamique">
    </div>
    <div class="form-row node-input-routes-container-row">
        <label><i class="fa fa-list"></i> Matrice des Endpoints & Contextes</label>
        <ol id="node-input-routes-container"></ol>
    </div>
</script>
