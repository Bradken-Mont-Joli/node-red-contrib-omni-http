<script type="text/javascript">
    RED.nodes.registerType('omni-http',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value:""},
            routes: {value: [{method:"get", url:""}]}
        },
        inputs:0, outputs:1, icon: "white-globe.svg",
        label: function() { return this.name || "omni http in"; },
        oneditprepare: function() {
            // Création de l'interface dynamique (Tableau éditable)
            $("#node-input-routes-container").css('min-height','250px').editableList({
                addItem: function(container, i, opt) {
                    var route = opt.hasOwnProperty('method') ? opt : {method:"get", url:""};
                    var row = $('<div/>').appendTo(container);
                    
                    var select = $('<select/>',{class:"node-input-route-method", style:"width:100px; margin-right:10px;"}).appendTo(row);
                    ['get','post','put','delete','patch'].forEach(m => select.append($("<option></option>").val(m).text(m.toUpperCase())));
                    select.val(route.method);

                    var input = $('<input/>',{class:"node-input-route-url", type:"text", style:"width:calc(100% - 120px);", placeholder:"/api/..."}).appendTo(row);
                    input.val(route.url);
                },
                removable: true, sortable: true
            });

            this.routes.forEach(r => $("#node-input-routes-container").editableList('addItem', r));
        },
        oneditsave: function() {
            var node = this;
            node.routes = [];
            $("#node-input-routes-container").editableList('items').each(function(i) {
                var method = $(this).find(".node-input-route-method").val();
                var url = $(this).find(".node-input-route-url").val();
                if (url) node.routes.push({method: method, url: url});
            });
        }
    });
</script>

<script type="text/html" data-template-name="omni-http">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row node-input-routes-container-row">
        <label><i class="fa fa-list"></i> Endpoints</label>
        <ol id="node-input-routes-container"></ol>
    </div>
</script>
