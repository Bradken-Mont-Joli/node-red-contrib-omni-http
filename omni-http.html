<!-- ===================================================================== -->
<!-- 1. DÉFINITION DU NŒUD OMNI-HTTP (ENTRÉE)                              -->
<!-- ===================================================================== -->
<script type="text/javascript">
    RED.nodes.registerType('omni-http',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value:""},
            actAsLinkIn: {value: false},
            globalProps: {value: []},
            routes: {value: [{method:"get", url:"", props: []}]}
        },
        inputs:0, outputs:1, icon: "white-globe.svg",
        label: function() { 
            var prefix = this.actAsLinkIn ? "🔗 " : "";
            if (this.name) return prefix + this.name;
            if (this.routes && this.routes.length > 0) {
                var methods = [...new Set(this.routes.map(r => r.method.toUpperCase()))];
                var routeLabel = this.routes.length > 1 ? this.routes.length + " routes" : this.routes[0].url;
                return prefix + "[" + methods.join("/") + "] " + routeLabel;
            }
            return prefix + "omni http in"; 
        },
        oneditprepare: function() {
            var root = RED.settings.httpNodeRoot || "/";
            if (root.slice(-1) !== "/") { root += "/"; }

            $("#node-input-actAsLinkIn").on("change", function() {
                if ($(this).is(":checked")) {
                    $("#omni-link-in-hint").slideDown(150);
                } else {
                    $("#omni-link-in-hint").slideUp(150);
                }
            });

            function buildPropertyRow(parentList, propData) {
                var pData = propData || {key: "", val: "", type: "str"};
                
                var pRow = $('<div/>', {
                    class: "node-input-route-prop-row", 
                    style: "display: flex; align-items: center; gap: 5px; width: 100%; flex-wrap: nowrap; margin-bottom: 4px;"
                }).appendTo(parentList);
                
                var msgFakeGroup = $('<div/>', {
                    style: "display: inline-flex; align-items: stretch; flex: 3 1 140px; min-width: 0; box-sizing: border-box;"
                }).appendTo(pRow);

                var msgLabel = $('<div/>', {
                    style: "border-radius: 4px 0 0 4px; pointer-events: none; font-family: var(--red-ui-primary-font); font-size: 14px; border: 1px solid var(--red-ui-form-input-border-color); border-right: none; box-sizing: border-box; background: var(--red-ui-form-button-background); height: 34px; line-height: 32px; padding: 0 3px 0 8px; color: var(--red-ui-form-text-color); white-space: nowrap; user-select: none; flex: 0 0 auto;"
                }).appendTo(msgFakeGroup);
                $('<span/>').text("msg.").appendTo(msgLabel);

                var pKey = $('<input/>', {
                    class: "node-input-prop-key", 
                    type: "text", 
                    placeholder: "payload",
                    style: "flex: 1; min-width: 0; height: 34px; margin: 0; border-radius: 0 4px 4px 0; border: 1px solid var(--red-ui-form-input-border-color); box-sizing: border-box; padding: 0 8px; font-family: var(--red-ui-primary-font); font-size: 14px; color: var(--red-ui-form-text-color);"
                }).val(pData.key).appendTo(msgFakeGroup);
                
                $('<span/>', {style: "color: #999; font-weight: bold; padding: 0 2px; user-select: none; flex: 0 0 auto;"}).text("=").appendTo(pRow);
                
                var pValWrapper = $('<div/>', {style: "flex: 7 1 200px; min-width: 0; display: flex;"}).appendTo(pRow);
                var pVal = $('<input/>', {class: "node-input-prop-val", type: "text", style: "margin:0;"}).appendTo(pValWrapper);
                
                pVal.typedInput({
                    default: pData.type || 'str',
                    types: ['str','num','bool','json','date','env','flow','global']
                });
                pVal.typedInput('value', pData.val);

                pVal.next(".red-ui-typedInput-container").css({ "width": "100%", "flex": "1", "min-width": "0" });

                $('<button/>', {
                    class: "red-ui-button red-ui-button-small",
                    style: "border: none; background: transparent; color: #aaa; padding: 0 4px; margin-left: 2px; flex: 0 0 auto;",
                    html: '<i class="fa fa-remove"></i>',
                    click: function(e) { e.preventDefault(); pRow.remove(); }
                }).appendTo(pRow);
            }

            $("#node-input-global-props-container").css('min-height','60px').editableList({
                addItem: function(container, i, opt) {
                    buildPropertyRow(container, opt);
                },
                removable: true, sortable: true
            });
            if (this.globalProps) {
                this.globalProps.forEach(p => $("#node-input-global-props-container").editableList('addItem', p));
            }

            $("#node-input-routes-container").css('min-height','250px').editableList({
                addItem: function(container, i, opt) {
                    var route = opt.hasOwnProperty('method') ? opt : {method:"get", url:"", props: []};
                    if (!route.props) route.props = [];
                    
                    var mainContainer = $('<div/>', {
                        style: "display: flex; flex-direction: column; width: calc(100% - 35px); gap: 4px; padding: 2px 0; box-sizing: border-box;"
                    }).appendTo(container);
                    
                    var row1 = $('<div/>', {style: "display: flex; align-items: center; width: 100%; gap: 5px; flex-wrap: nowrap;"}).appendTo(mainContainer);
                    
                    var select = $('<select/>',{class:"node-input-route-method", style:"width:90px; flex: 0 0 90px; margin:0;"}).appendTo(row1);
                    ['get','post','put','delete','patch'].forEach(m => select.append($("<option></option>").val(m).text(m.toUpperCase())));
                    select.val(route.method);

                    $('<span/>', {style: "font-family: monospace; color: #888; font-size: 12px; white-space: nowrap; user-select: none; flex: 0 0 auto;"}).text(root).appendTo(row1);

                    var inputUrl = $('<input/>',{class:"node-input-route-url", type:"text", style:"flex: 1; min-width: 0; margin:0;", placeholder:"entities/document"}).appendTo(row1);
                    var displayUrl = route.url || "";
                    if (displayUrl.startsWith('/')) displayUrl = displayUrl.substring(1);
                    inputUrl.val(displayUrl);

                    var addPropBtn = $('<button/>', {
                        class: "red-ui-button red-ui-button-small",
                        style: "margin-left: 5px; white-space: nowrap; color: #555; flex: 0 0 auto;",
                        html: '<i class="fa fa-plus"></i> Variable'
                    }).appendTo(row1);

                    var propsListContainer = $('<div/>', {
                        class: "node-input-route-props-list", 
                        style: "display: flex; flex-direction: column; gap: 0px; margin-top: 4px; padding-left: 12px; width: 100%; box-sizing: border-box;"
                    }).appendTo(mainContainer);

                    if (route.props && route.props.length > 0) {
                        route.props.forEach(p => buildPropertyRow(propsListContainer, p));
                    }

                    addPropBtn.on('click', function(e) {
                        e.preventDefault();
                        buildPropertyRow(propsListContainer);
                    });
                },
                removable: true, sortable: true
            });

            this.routes.forEach(r => $("#node-input-routes-container").editableList('addItem', r));
        },
        oneditsave: function() {
            var node = this;
            
            node.globalProps = [];
            $("#node-input-global-props-container").editableList('items').each(function() {
                var k = $(this).find(".node-input-prop-key").val().trim();
                var v = $(this).find(".node-input-prop-val").typedInput('value');
                var t = $(this).find(".node-input-prop-val").typedInput('type');
                if (k) node.globalProps.push({key: k, val: v, type: t});
            });

            node.routes = [];
            $("#node-input-routes-container").editableList('items').each(function() {
                var method = $(this).find(".node-input-route-method").val();
                var url = $(this).find(".node-input-route-url").val().trim();
                
                var routeObj = { method: method, url: url, props: [] };

                $(this).find(".node-input-route-prop-row").each(function() {
                    var k = $(this).find(".node-input-prop-key").val().trim();
                    var v = $(this).find(".node-input-prop-val").typedInput('value');
                    var t = $(this).find(".node-input-prop-val").typedInput('type');
                    if (k) routeObj.props.push({key: k, val: v, type: t});
                });
                
                if (url) {
                    url = url.replace(/^\/+|\/+$/g, '');
                    url = '/' + url;
                    routeObj.url = url;
                    node.routes.push(routeObj);
                }
            });
        }
    });

    // =====================================================================
    // 2. DÉFINITION DU NŒUD OMNI-REPLY (SORTIE HYBRIDE HTTP / LINK CALL)
    // =====================================================================
    RED.nodes.registerType('omni-reply',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value: ""},
            statusCode: {value: "", validate: RED.validators.regex(/^$|^[0-9]{3}$/)},
            showStatus: {value: true}
        },
        inputs: 1,
        outputs: 1,
        align: "right",
        icon: "white-globe.svg",
        paletteLabel: "omni reply",
        inputLabels: "http / link response",
        outputLabels: ["clean msg (post-response)"],
        label: function() {
            return this.name || (this.statusCode ? "omni reply (" + this.statusCode + ")" : "omni reply");
        }
    });

    // =====================================================================
    // 3. DÉFINITION DU NŒUD OMNI-LINK-CALL (APPELANT)
    // =====================================================================
    RED.nodes.registerType('omni-link-call',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value: ""},
            links: {value: []},
            linkType: {value: "dynamic"},
            timeout: {value: 30, validate: RED.validators.number()},
            showStatus: {value: true},
            showDuration: {value: true}
        },
        inputs: 1,
        outputs: 1,
        icon: "link-call.svg",
        paletteLabel: "omni link call",
        label: function() {
            return this.name || "omni link call";
        },
        oneditprepare: function() {
            var node = this;

            $("#node-input-linkType").on("change", function() {
                if (this.value === "static") {
                    $("#node-row-static-links").show();
                } else {
                    $("#node-row-static-links").hide();
                }
            });

            var select = $("#node-input-static-target");
            RED.nodes.eachNode(function(n) {
                if (n.type === "link in" || (n.type === "omni-http" && n.actAsLinkIn)) {
                    var label = n.name || n.url || n.id;
                    var typeLabel = n.type === "omni-http" ? "omni-http" : "link in";
                    select.append($("<option></option>").val(n.id).text(`[${typeLabel}] ${label}`));
                }
            });

            if (node.links && node.links.length > 0) {
                select.val(node.links[0]);
            }
        },
        oneditsave: function() {
            if ($("#node-input-linkType").val() === "static") {
                this.links = [$("#node-input-static-target").val()];
            } else {
                this.links = [];
            }
        }
    });
</script>

<script type="text/html" data-template-name="omni-http">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="Ex: /planning/assembly">
    </div>
    <div class="form-row" style="margin-bottom: 12px;">
        <label for="node-input-actAsLinkIn"><i class="fa fa-link"></i> Link In</label>
        <input type="checkbox" id="node-input-actAsLinkIn" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 6px; font-weight: 500;">Act as Link In (Accepter les appels <code>link call</code> internes)</span>
        <div id="omni-link-in-hint" style="display: none; margin-top: 6px; padding: 8px 10px; background: var(--red-ui-secondary-background, #f7f7f7); border-left: 3px solid #3FADB5; font-size: 12px; color: #555;">
            <b>Mode Link Call Dynamique :</b> Définissez <code>msg.target</code> sur le nom de ce nœud (ex: <code>"/planning/assembly"</code>) ou passez l'URL dans <code>msg.url</code>.
        </div>
    </div>
    <div class="form-row node-input-global-props-container-row" style="margin-bottom: 24px;">
        <label style="width: 100%; font-weight: bold;"><i class="fa fa-globe"></i> Variables Globales (S'appliquent à tous les Endpoints)</label>
        <ol id="node-input-global-props-container"></ol>
    </div>
    <div class="form-row node-input-routes-container-row">
        <label style="width: 100%; font-weight: bold;"><i class="fa fa-list"></i> Matrice des Endpoints Spécifiques</label>
        <ol id="node-input-routes-container"></ol>
    </div>
</script>

<script type="text/html" data-template-name="omni-reply">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="omni reply">
    </div>
    <div class="form-row">
        <label for="node-input-statusCode"><i class="fa fa-code"></i> Status Code</label>
        <input type="text" id="node-input-statusCode" placeholder="Laisser vide pour msg.statusCode (défaut: 200)" style="width: 70%;">
    </div>
    <div class="form-row">
        <label for="node-input-showStatus"><i class="fa fa-eye"></i> Statut UI</label>
        <input type="checkbox" id="node-input-showStatus" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 6px;">Afficher le code de statut et le temps de réponse sous le nœud</span>
    </div>
</script>

<script type="text/html" data-template-name="omni-link-call">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="omni link call">
    </div>
    <div class="form-row">
        <label for="node-input-linkType"><i class="fa fa-random"></i> Type de lien</label>
        <select id="node-input-linkType" style="width: 70%;">
            <option value="dynamic">Dynamique (msg.target, msg.url, msg.topic)</option>
            <option value="static">Statique (Cible fixe)</option>
        </select>
    </div>
    <div class="form-row" id="node-row-static-links" style="display:none;">
        <label for="node-input-static-target"><i class="fa fa-crosshairs"></i> Nœud Cible</label>
        <select id="node-input-static-target" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (s)</label>
        <input type="text" id="node-input-timeout" placeholder="30" style="width: 70%;">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-showStatus"><i class="fa fa-eye"></i> Statut de retour</label>
        <input type="checkbox" id="node-input-showStatus" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 6px;">Afficher le code de statut (ex: Code 200)</span>
    </div>
    <div class="form-row">
        <label for="node-input-showDuration"><i class="fa fa-clock-o"></i> Temps d'exécution</label>
        <input type="checkbox" id="node-input-showDuration" style="display: inline-block; width: auto; vertical-align: top;">
        <span style="margin-left: 6px;">Afficher la durée d'exécution en millisecondes</span>
    </div>
    <div class="form-tips" style="margin-top: 12px;">
        <b>Astuce :</b> En mode Dynamique, le nœud interroge tout l'espace de travail pour trouver le nœud <code>link in</code> ou <code>omni-http</code> correspondant à <code>msg.target</code>. En mode Statique, le lien est figé comme un nœud natif.
    </div>
</script>

<script type="text/html" data-help-name="omni-reply">
    <p>Termine proprement un cycle requête-réponse HTTP <b>ou</b> un appel interne <code>link call</code>, puis nettoie les références mémoire <code>msg.req</code> et <code>msg.res</code>.</p>
</script>

<script type="text/html" data-help-name="omni-link-call">
    <p>Déclenche de manière asynchrone l'exécution d'un autre flux en mémoire et attend son retour (via un nœud <code>omni-reply</code> ou un nœud retour natif).</p>
    <p>Ce nœud personnalise le concept du `link call` natif en retirant les restrictions de type, lui permettant de cibler à la fois les nœuds `link in` classiques ET vos nœuds `omni-http` configurés comme points d'entrée internes.</p>
    <h3>Routage</h3>
    <p>Définissez simplement le nom exact du nœud cible (ex: <code>"/api/process"</code>) dans <code>msg.target</code> avant de passer par ce nœud.</p>
</script>
