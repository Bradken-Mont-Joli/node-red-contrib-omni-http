<script type="text/javascript">
    RED.nodes.registerType('omni-http',{
        category: 'network',
        color: '#e7e7ae',
        defaults: {
            name: {value:""},
            routes: {value: [{method:"get", url:"", props: []}]}
        },
        inputs:0, outputs:1, icon: "white-globe.svg",
        label: function() { 
            if (this.name) return this.name;
            if (this.routes && this.routes.length > 0) {
                var methods = [...new Set(this.routes.map(r => r.method.toUpperCase()))];
                var routeLabel = this.routes.length > 1 ? this.routes.length + " routes" : this.routes[0].url;
                return "[" + methods.join("/") + "] " + routeLabel;
            }
            return "omni http in"; 
        },
        oneditprepare: function() {
            var root = RED.settings.httpNodeRoot || "/";
            if (root.slice(-1) !== "/") { root += "/"; }

            // Matrice principale des Endpoints
            $("#node-input-routes-container").css('min-height','300px').editableList({
                addItem: function(container, i, opt) {
                    var route = opt.hasOwnProperty('method') ? opt : {method:"get", url:"", props: []};
                    if (!route.props) route.props = [];
                    
                    // 🟢 FIX RESPONSIVE : display: flex block-level avec largeur calculée propre
                    var mainContainer = $('<div/>', {
                        style: "display: flex; flex-direction: column; width: calc(100% - 35px); gap: 6px; padding: 2px 0; box-sizing: border-box;"
                    }).appendTo(container);
                    
                    // --- LIGNE 1 : METHODE + URL + BOUTON AJOUT VARIABLE ---
                    var row1 = $('<div/>', {style: "display: flex; align-items: center; width: 100%; gap: 5px; flex-wrap: nowrap;"}).appendTo(mainContainer);
                    
                    var select = $('<select/>',{class:"node-input-route-method", style:"width:90px; flex: 0 0 90px; margin:0;"}).appendTo(row1);
                    ['get','post','put','delete','patch'].forEach(m => select.append($("<option></option>").val(m).text(m.toUpperCase())));
                    select.val(route.method);

                    $('<span/>', {style: "font-family: monospace; color: #888; font-size: 12px; white-space: nowrap; user-select: none; flex: 0 0 auto;"}).text(root).appendTo(row1);

                    // 🟢 FIX LARGEUR : min-width: 0 permet au champ de se contracter sans pousser le reste hors-champ
                    var inputUrl = $('<input/>',{class:"node-input-route-url", type:"text", style:"flex: 1; min-width: 0; margin:0;", placeholder:"entities/document"}).appendTo(row1);
                    var displayUrl = route.url || "";
                    if (displayUrl.startsWith('/')) displayUrl = displayUrl.substring(1);
                    inputUrl.val(displayUrl);

                    // Bouton style Inject "+ Variable"
                    var addPropBtn = $('<button/>', {
                        class: "red-ui-button red-ui-button-small",
                        style: "margin-left: 5px; white-space: nowrap; color: #555; flex: 0 0 auto;",
                        html: '<i class="fa fa-plus"></i> Variable'
                    }).appendTo(row1);

                    // --- ZONE DES VARIABLES ---
                    var propsListContainer = $('<div/>', {
                        class: "node-input-route-props-list", 
                        style: "display: flex; flex-direction: column; gap: 4px; margin-top: 4px; padding-left: 12px; width: 100%; box-sizing: border-box;"
                    }).appendTo(mainContainer);

                    // Générateur de ligne de propriété (Look & Feel 100% Inject original)
                    function createPropertyRow(propData) {
                        var pData = propData || {key: "payload", val: "", type: "str"};
                        
                        var pRow = $('<div/>', {
                            class: "node-input-route-prop-row", 
                            style: "display: flex; align-items: center; gap: 5px; width: 100%; flex-wrap: nowrap;"
                        }).appendTo(propsListContainer);
                        
                        // 🟢 LOOK INJECT : Bloc fusionné "msg. [champ textuel]"
                        var msgFakeGroup = $('<div/>', {
                            style: "display: inline-flex; align-items: center; flex: 0 0 auto;"
                        }).appendTo(pRow);

                        // Bouton de type désactivé natif
                        var msgBtn = $('<button/>', {
                            type: "button",
                            class: "red-ui-typedInput-type-select disabled",
                            tabindex: "-1",
                            title: "msg.",
                            style: "border-radius: 4px 0 0 4px; cursor: default; height: 34px; margin: 0; padding: 0 10px; background: #eee; border: 1px solid #ccc; border-right: none; color: #444; font-size: 13px;"
                        }).appendTo(msgFakeGroup);
                        $('<span/>', {class: "red-ui-typedInput-type-label"}).text("msg.").appendTo(msgBtn);

                        // Champ de saisie de la clé fusionné au bouton
                        var pKey = $('<input/>', {
                            class: "node-input-prop-key", 
                            type: "text", 
                            style: "width: 120px; height: 34px; margin: 0; border-radius: 0 4px 4px 0; border: 1px solid #ccc; box-sizing: border-box; padding: 0 8px;"
                        }).val(pData.key).appendTo(msgFakeGroup);
                        
                        // Séparateur "="
                        $('<span/>', {style: "color: #999; font-weight: bold; padding: 0 2px; user-select: none; flex: 0 0 auto;"}).text("=").appendTo(pRow);
                        
                        // 🟢 FIX ÉCRASEMENT 14PX : Conteneur flex avec min-width: 0 obligatoire pour stabiliser le typedInput
                        var pValWrapper = $('<div/>', {style: "flex: 1; min-width: 0; display: flex;"}).appendTo(pRow);
                        var pVal = $('<input/>', {class: "node-input-prop-val", type: "text", style: "margin:0;"}).appendTo(pValWrapper);
                        
                        pVal.typedInput({
                            default: pData.type || 'str',
                            types: ['str','num','bool','json','date','env','flow','global'],
                            width: '100%' 
                        });
                        pVal.typedInput('value', pData.val);

                        // Bouton de suppression de la variable ancré de manière immuable à droite
                        $('<button/>', {
                            class: "red-ui-button red-ui-button-small",
                            style: "border: none; background: transparent; color: #aaa; padding: 0 4px; margin-left: 2px; flex: 0 0 auto;",
                            html: '<i class="fa fa-remove"></i>',
                            click: function(e) { e.preventDefault(); pRow.remove(); }
                        }).appendTo(pRow);
                    }

                    // Recharger les lignes existantes
                    if (route.props && route.props.length > 0) {
                        route.props.forEach(p => createPropertyRow(p));
                    }

                    addPropBtn.on('click', function(e) {
                        e.preventDefault();
                        createPropertyRow();
                    });
                },
                removable: true, sortable: true
            });

            this.routes.forEach(r => $("#node-input-routes-container").editableList('addItem', r));
        },
        oneditsave: function() {
            var node = this;
            node.routes = [];

            $("#node-input-routes-container").editableList('items').each(function(i) {
                var method = $(this).find(".node-input-route-method").val();
                var url = $(this).find(".node-input-route-url").val().trim();
                
                var routeObj = {
                    method: method,
                    url: url,
                    props: []
                };

                $(this).find(".node-input-route-prop-row").each(function() {
                    var k = $(this).find(".node-input-prop-key").val().trim();
                    var v = $(this).find(".node-input-prop-val").typedInput('value');
                    var t = $(this).find(".node-input-prop-val").typedInput('type');
                    
                    if (k) {
                        routeObj.props.push({key: k, val: v, type: t});
                    }
                });
                
                if (url) {
                    url = url.replace(/^\/+|\/+$/g, '');
                    url = '/' + url;
                    routeObj.url = url;
                    node.routes.push(routeObj);
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="omni-http">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Nom</label>
        <input type="text" id="node-input-name" placeholder="Laisser vide pour calcul dynamique">
    </div>
    <div class="form-row node-input-routes-container-row">
        <label><i class="fa fa-list"></i> Matrice des Endpoints</label>
        <ol id="node-input-routes-container"></ol>
    </div>
</script>
